<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F5F2EC" />
      <stop offset="100%" stop-color="#E8E1D5" />
    </radialGradient>

    <!-- Bottle Amber Glass Gradient -->
    <linearGradient id="amberGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3A1700" />
      <stop offset="15%" stop-color="#6E3205" />
      <stop offset="35%" stop-color="#A25010" />
      <stop offset="60%" stop-color="#7B3708" />
      <stop offset="85%" stop-color="#461E02" />
      <stop offset="100%" stop-color="#230E01" />
    </linearGradient>

    <!-- Bottle Highlight Reflection -->
    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="20%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Gold Cap Gradient -->
    <linearGradient id="goldCap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7A5B18" />
      <stop offset="25%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#FBF0B9" />
      <stop offset="75%" stop-color="#C59B27" />
      <stop offset="100%" stop-color="#5A400E" />
    </linearGradient>

    <!-- Label Gradient -->
    <linearGradient id="labelBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="100%" stop-color="#F7F1E5" />
    </linearGradient>

    <!-- Teal Accent Gradient -->
    <linearGradient id="tealAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0E443F" />
      <stop offset="100%" stop-color="#1B6B63" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="bottleShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="20" flood-color="#3A1E0B" flood-opacity="0.25" />
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.15" />
    </filter>

    <filter id="labelShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="600" height="750" rx="24" fill="url(#bgGlow)" />

  <!-- Subtle Botanical Ambient Background Watermark -->
  <g opacity="0.04" stroke="#0E443F" stroke-width="2" fill="none">
    <circle cx="300" cy="380" r="220" />
    <circle cx="300" cy="380" r="170" stroke-dasharray="6,6" />
    <path d="M300,160 Q340,260 300,380 Q260,260 300,160" />
    <path d="M300,600 Q340,500 300,380 Q260,500 300,600" />
    <path d="M160,380 Q260,420 380,380 Q260,340 160,380" />
    <path d="M440,380 Q340,420 300,380 Q340,340 440,380" />
  </g>

  <!-- Bottle Ground Shadow -->
  <ellipse cx="300" cy="650" rx="140" ry="24" fill="#3D2614" opacity="0.22" filter="blur(10px)" />
  <ellipse cx="300" cy="646" rx="90" ry="12" fill="#1C0E05" opacity="0.35" filter="blur(4px)" />

  <!-- Main Bottle Group -->
  <g filter="url(#bottleShadow)">
    
    <!-- Bottle Body (Amber Glass) -->
    <rect x="175" y="240" width="250" height="380" rx="36" fill="url(#amberGlass)" />
    
    <!-- Bottle Shoulder & Neck -->
    <path d="M220,240 Q220,180 250,170 L250,135 L350,135 L350,170 Q380,180 380,240 Z" fill="url(#amberGlass)" />
    
    <!-- Glass Highlights / Refraction Lines -->
    <rect x="195" y="245" width="30" height="365" rx="15" fill="url(#glassReflection)" />
    <rect x="375" y="245" width="18" height="365" rx="9" fill="url(#glassReflection)" opacity="0.6" />

    <!-- Screw Cap Neck Rim -->
    <rect x="245" y="125" width="110" height="15" rx="4" fill="url(#goldCap)" />

    <!-- Cap (Metallic Gold) -->
    <rect x="240" y="70" width="120" height="60" rx="8" fill="url(#goldCap)" />
    
    <!-- Cap Ridges / Texture -->
    <g opacity="0.25" stroke="#4A3408" stroke-width="1.5">
      <line x1="250" y1="72" x2="250" y2="128" />
      <line x1="260" y1="72" x2="260" y2="128" />
      <line x1="270" y1="72" x2="270" y2="128" />
      <line x1="280" y1="72" x2="280" y2="128" />
      <line x1="290" y1="72" x2="290" y2="128" />
      <line x1="300" y1="72" x2="300" y2="128" />
      <line x1="310" y1="72" x2="310" y2="128" />
      <line x1="320" y1="72" x2="320" y2="128" />
      <line x1="330" y1="72" x2="330" y2="128" />
      <line x1="340" y1="72" x2="340" y2="128" />
      <line x1="350" y1="72" x2="350" y2="128" />
    </g>
    <rect x="240" y="66" width="120" height="8" rx="3" fill="#FBF0B9" opacity="0.8" />

    <!-- ============================================================= -->
    <!-- PRODUCT LABEL                                                 -->
    <!-- ============================================================= -->
    <g filter="url(#labelShadow)">
      <!-- Label Background Container -->
      <rect x="185" y="275" width="230" height="315" rx="14" fill="url(#labelBg)" stroke="#D4AF37" stroke-width="1.5" />
      
      <!-- Label Inner Gold Border -->
      <rect x="191" y="281" width="218" height="303" rx="10" fill="none" stroke="#C59B27" stroke-width="0.8" stroke-dasharray="4,2" opacity="0.7" />

      <!-- Top Header Brand Crest -->
      <g transform="translate(300, 310)">
        <!-- Small Lotus / Herb Emblem -->
        <path d="M0,-14 C-6,-6 -8,0 0,6 C8,0 6,-6 0,-14 Z" fill="#D4AF37" />
        <path d="M-2,-2 C-10,-5 -14,2 -6,7 C-2,5 -1,1 -2,-2 Z" fill="#C59B27" />
        <path d="M2,-2 C10,-5 14,2 6,7 C2,5 1,1 2,-2 Z" fill="#C59B27" />
      </g>

      <!-- Brand Name -->
      <text x="300" y="330" font-family="serif" font-size="10.5" font-weight="700" letter-spacing="2.5" fill="#0E443F" text-anchor="middle">
        SATTVIC ADVANCED AYURVEDA
      </text>
      <text x="300" y="342" font-family="sans-serif" font-size="6.5" font-weight="600" letter-spacing="1.5" fill="#8C6D23" text-anchor="middle">
        AUTHENTIC CLINICAL FORMULATION
      </text>

      <!-- Horizontal Divider Line -->
      <line x1="220" y1="350" x2="380" y2="350" stroke="#D4AF37" stroke-width="1" />
      <circle cx="300" cy="350" r="2.5" fill="#D4AF37" />

      <!-- Main Product Name (English) -->
      <text x="300" y="390" font-family="serif" font-size="30" font-weight="bold" letter-spacing="2" fill="#0E443F" text-anchor="middle">
        RAKTA – B
      </text>

      <!-- Product Name in Devanagari (Hindi) -->
      <text x="300" y="414" font-family="sans-serif" font-size="15" font-weight="bold" fill="#8C6D23" text-anchor="middle">
        रक्त – बी
      </text>

      <!-- Formulation Category -->
      <rect x="215" y="426" width="170" height="20" rx="10" fill="url(#tealAccent)" />
      <text x="300" y="439" font-family="sans-serif" font-size="7.5" font-weight="bold" letter-spacing="1" fill="#FFFFFF" text-anchor="middle">
        CLASSICAL BLOOD PURIFIER
      </text>

      <!-- Subtitle / Clinical Function -->
      <text x="300" y="464" font-family="serif" font-size="8" font-style="italic" fill="#333333" text-anchor="middle">
        Dermal Revitalizer &amp; Pitta Shodhaka
      </text>
      <text x="300" y="477" font-family="sans-serif" font-size="7" fill="#555555" text-anchor="middle">
        For Psoriasis, Eczema, Dermatitis &amp; Acne
      </text>

      <!-- Decorative Divider -->
      <line x1="235" y1="490" x2="365" y2="490" stroke="#E0D7C6" stroke-width="0.8" />

      <!-- Key Botanical Highlights -->
      <text x="300" y="504" font-family="sans-serif" font-size="6.5" font-weight="600" fill="#0E443F" text-anchor="middle">
        Manjistha • Sariva • Guduchi • Haridra
      </text>

      <!-- Bottom Badges Strip -->
      <g transform="translate(195, 522)">
        <rect x="0" y="0" width="65" height="24" rx="4" fill="#F0ECE1" />
        <text x="32" y="11" font-family="sans-serif" font-size="5.5" font-weight="bold" fill="#7A5B18" text-anchor="middle">QUANTITY</text>
        <text x="32" y="20" font-family="sans-serif" font-size="7.5" font-weight="bold" fill="#0E443F" text-anchor="middle">60 Tablets</text>

        <rect x="72" y="0" width="66" height="24" rx="4" fill="#F0ECE1" />
        <text x="105" y="11" font-family="sans-serif" font-size="5.5" font-weight="bold" fill="#7A5B18" text-anchor="middle">PURITY</text>
        <text x="105" y="20" font-family="sans-serif" font-size="7" font-weight="bold" fill="#0E443F" text-anchor="middle">100% Herbal</text>

        <rect x="145" y="0" width="65" height="24" rx="4" fill="#F0ECE1" />
        <text x="177" y="11" font-family="sans-serif" font-size="5.5" font-weight="bold" fill="#7A5B18" text-anchor="middle">STANDARD</text>
        <text x="177" y="20" font-family="sans-serif" font-size="7" font-weight="bold" fill="#0E443F" text-anchor="middle">Ayurvedic</text>
      </g>

      <!-- Exclusivity Footer Banner on Label -->
      <rect x="191" y="556" width="218" height="22" rx="0" fill="#0E443F" />
      <text x="300" y="570" font-family="sans-serif" font-size="6.5" font-weight="bold" letter-spacing="1" fill="#FBF0B9" text-anchor="middle">
        EXCLUSIVE FOR SATTVIC PATIENTS
      </text>
    </g>
  </g>

  <!-- Ambient Floating Medicinal Elements (Subtle Botanical Touch) -->
  <g transform="translate(110, 540) rotate(-15)">
    <!-- Natural Leaf Accent -->
    <path d="M0,0 Q25,-30 50,-10 Q25,20 0,0 Z" fill="#3D7B54" opacity="0.85" />
    <path d="M0,0 Q25,-15 50,-10" stroke="#2D5C3E" stroke-width="1.5" fill="none" />
  </g>
  <g transform="translate(480, 580) rotate(25)">
    <!-- Natural Herb Accent -->
    <path d="M0,0 Q-25,-25 -45,-5 Q-20,20 0,0 Z" fill="#2E6845" opacity="0.85" />
    <path d="M0,0 Q-25,-12 -45,-5" stroke="#1D442C" stroke-width="1.5" fill="none" />
  </g>

  <!-- Corner Trust Pill -->
  <g transform="translate(30, 30)">
    <rect width="180" height="34" rx="17" fill="#0E443F" />
    <circle cx="18" cy="17" r="8" fill="#D4AF37" />
    <path d="M15,17 L17.5,19.5 L22,14" stroke="#0E443F" stroke-width="1.8" fill="none" />
    <text x="34" y="21" font-family="sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF" letter-spacing="0.5">
      PHYSICIAN FORMULATED
    </text>
  </g>

</svg>
